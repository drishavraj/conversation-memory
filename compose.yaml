services:
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://memory:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/memory
      OWNER_API_TOKEN: ${OWNER_API_TOKEN:?Set OWNER_API_TOKEN in .env}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      SARVAM_API_KEY: ${SARVAM_API_KEY:-}
      GEMINI_MODELS: ${GEMINI_MODELS:-}
      APP_ENV: ${APP_ENV:-development}
      GENERATION_MODEL: ${GENERATION_MODEL:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      SEMANTIC_MIN_SIMILARITY: ${SEMANTIC_MIN_SIMILARITY:-0.6}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  worker:
    build: .
    profiles: ["processing"]
    command: ["python", "-m", "app.worker", "--loop"]
    restart: unless-stopped
    stop_grace_period: 150s
    environment:
      DATABASE_URL: postgresql+psycopg://memory:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/memory
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      SARVAM_API_KEY: ${SARVAM_API_KEY:-}
      GEMINI_MODELS: ${GEMINI_MODELS:-}
      APP_ENV: ${APP_ENV:-development}
      GENERATION_MODEL: ${GENERATION_MODEL:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      SEMANTIC_MIN_SIMILARITY: ${SEMANTIC_MIN_SIMILARITY:-0.6}
    depends_on:
      api:
        condition: service_started
      postgres:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: memory
      POSTGRES_USER: memory
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memory -d memory"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
