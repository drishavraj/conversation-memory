<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light dark"><title>Memories — interactive concept</title><style>body{margin:0;padding:16px;max-width:1100px;margin-inline:auto;font-family:system-ui} @media(max-width:700px){body{padding:0}}</style></head><body>
<style>
#memory-cloud {--mc-bg:light-dark(#f5f7fa,#101619);--mc-panel:light-dark(#fff,#182126);--mc-text:light-dark(#1d303c,#e6f0f5);--mc-muted:light-dark(#596d7b,#a2b6c2);--mc-line:light-dark(#dbe4ea,#30424c);--mc-blue:light-dark(#d5e9ff,#203d58);--mc-lilac:light-dark(#e4ddfa,#37334d);--mc-mint:light-dark(#d7eee5,#203f3b);font:14px/1.5 system-ui,sans-serif;color:var(--mc-text);background:var(--mc-bg);border-radius:18px;overflow:hidden;}
#memory-cloud *{box-sizing:border-box}#memory-cloud button,#memory-cloud select,#memory-cloud input{font:inherit;color:inherit}#memory-cloud button{cursor:pointer}#memory-cloud button:focus-visible,#memory-cloud input:focus-visible,#memory-cloud select:focus-visible{outline:3px solid #659fde;outline-offset:3px}#memory-cloud header{padding:20px 26px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--mc-line);gap:12px;flex-wrap:wrap}#memory-cloud .mc-brand{font-size:20px;font-weight:600;letter-spacing:-.7px}#memory-cloud .mc-demo{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--mc-muted)}#memory-cloud .mc-shell{display:grid;grid-template-columns:minmax(0,1fr) 290px;min-height:630px}#memory-cloud .mc-main{padding:24px;min-width:0}#memory-cloud .mc-title{font-size:32px;letter-spacing:-1.3px;font-weight:500;margin:8px 0}#memory-cloud .mc-muted{color:var(--mc-muted);font-size:12px}#memory-cloud .mc-toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:18px 0}#memory-cloud .mc-control{border:1px solid var(--mc-line);border-radius:10px;padding:9px 12px;background:var(--mc-panel);min-height:42px}#memory-cloud input{min-width:0;flex:1;width:150px}#memory-cloud .mc-crumb{display:flex;gap:6px;flex-wrap:wrap;align-items:center;min-height:32px}#memory-cloud .mc-link{border:0;background:transparent;padding:6px 0;color:var(--mc-muted);text-align:left}#memory-cloud .mc-map{height:405px;position:relative;isolation:isolate;background:radial-gradient(ellipse at 48% 46%,color-mix(in srgb,var(--mc-blue) 25%,transparent),transparent 65%);border-radius:30px}#memory-cloud .mc-cloud{position:absolute;left:var(--x);top:var(--y);width:var(--w,170px);min-height:112px;transform:translate(-50%,-50%);border:0;background:transparent;padding:22px 14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;text-align:center;isolation:isolate;transition:filter .18s ease}#memory-cloud .mc-cloud:before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 30% 12%,color-mix(in srgb,var(--mc-panel) 70%,transparent),transparent 65%),var(--fill,var(--mc-blue));border-radius:44% 56% 58% 42% / 55% 48% 52% 45%;box-shadow:inset 0 1px 1px color-mix(in srgb,var(--mc-text) 14%,transparent),0 12px 30px color-mix(in srgb,var(--mc-bg) 55%,transparent);z-index:-1;transition:transform .2s ease}#memory-cloud .mc-cloud:hover:before,#memory-cloud .mc-cloud:focus-visible:before{transform:scale(1.045)}#memory-cloud .mc-cloud[aria-pressed=true]:before{outline:2px solid var(--mc-muted);outline-offset:4px}#memory-cloud .mc-cloud strong{font-weight:500;font-size:17px;line-height:1.3}#memory-cloud .mc-cloud small{font-size:11px;color:var(--mc-muted)}#memory-cloud .mc-list{display:grid;gap:10px;padding:16px 0;min-height:300px;align-content:start}#memory-cloud .mc-list .mc-cloud{position:relative;left:auto;top:auto;transform:none;width:100%;min-height:74px;align-items:flex-start;text-align:left;padding:16px 22px}#memory-cloud .mc-list .mc-cloud:before{border-radius:14px}#memory-cloud .mc-rail{background:var(--mc-panel);padding:22px;border-left:1px solid var(--mc-line);min-width:0}#memory-cloud .mc-tabs{display:flex;gap:8px;margin-bottom:24px}#memory-cloud .mc-tabs button{flex:1}#memory-cloud button[aria-selected=true]{background:var(--mc-text);color:var(--mc-panel)}#memory-cloud .mc-rail h3{font-size:23px;font-weight:500;letter-spacing:-.5px;margin:6px 0 20px}#memory-cloud .mc-block{padding:16px 0;border-top:1px solid var(--mc-line)}#memory-cloud .mc-block p{margin:8px 0}#memory-cloud .mc-eyebrow{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--mc-muted)}#memory-cloud .mc-source{font-size:12px;color:var(--mc-muted);border:0;background:transparent;padding:6px 0;text-decoration:underline;text-underline-offset:3px}#memory-cloud blockquote{margin:10px 0;padding:12px;border-left:2px solid var(--mc-muted);background:var(--mc-bg);font-size:13px}#memory-cloud .mc-question{width:100%;text-align:left;margin-top:10px;font-size:13px}#memory-cloud .mc-answer{padding:16px;background:var(--mc-bg);border-radius:12px;margin-top:18px}#memory-cloud .mc-mobile-close{display:none}#memory-cloud .mc-empty{padding:55px 20px;color:var(--mc-muted);text-align:center}#memory-cloud .mc-footer{border-top:1px solid var(--mc-line);padding:12px 26px;color:var(--mc-muted);font-size:12px;display:flex;justify-content:space-between;gap:12px}#memory-cloud [hidden]{display:none!important}
@media(max-width:700px){#memory-cloud .mc-shell{grid-template-columns:1fr}#memory-cloud .mc-main{padding:18px}#memory-cloud header{padding:16px 18px}#memory-cloud .mc-title{font-size:28px}#memory-cloud .mc-map{height:430px}#memory-cloud .mc-cloud{width:135px;min-height:108px;padding:18px 9px}#memory-cloud .mc-cloud strong{font-size:15px}#memory-cloud .mc-rail{border-left:0;border-top:1px solid var(--mc-line)}#memory-cloud .mc-mobile-close{display:block;margin-bottom:15px}#memory-cloud .mc-shell.mobile-detail .mc-main{display:none}#memory-cloud .mc-shell:not(.mobile-detail) .mc-rail{display:none}#memory-cloud .mc-footer{padding:12px 18px}}
@media(prefers-reduced-motion:reduce){#memory-cloud *,#memory-cloud *::before,#memory-cloud *::after{transition:none!important}}
</style>
<div id="memory-cloud">
 <header><span class="mc-brand">Memory<span style="color:var(--mc-muted)"> / Memories</span></span><span class="mc-demo">Interactive concept · Sample data</span></header>
 <div class="mc-shell">
  <main class="mc-main">
   <nav class="mc-crumb" aria-label="Memory location"></nav>
   <h2 class="mc-title">A place for everything you know.</h2>
   <div class="mc-muted" id="mc-subtitle">Explore a project. Follow a thought.</div>
   <div class="mc-toolbar"><input class="mc-control" id="mc-search" aria-label="Search visible projects or topics" placeholder="Find a project…"><select class="mc-control" id="mc-theme" aria-label="Theme"><option>All themes</option><option>Office</option><option>Personal</option><option>Side Projects</option></select><button class="mc-control" id="mc-view">List view</button><button class="mc-control" id="mc-ask">Ask memories</button></div>
   <div id="mc-canvas" class="mc-map" aria-label="Projects"></div>
   <div class="mc-muted" id="mc-caption">Select a cloud to explore its topics.</div>
  </main>
  <aside class="mc-rail" aria-label="Memory details and questions"><button class="mc-link mc-mobile-close" id="mc-close">← Back to map</button><div class="mc-tabs"><button class="mc-control" id="mc-details-tab" aria-selected="true">Overview</button><button class="mc-control" id="mc-ask-tab" aria-selected="false">Ask</button></div><div id="mc-rail-content"></div></aside>
 </div>
 <footer class="mc-footer"><span>Source-backed. Connected. Yours.</span><span id="mc-level">Projects</span></footer>
</div>
<script>
(()=>{
 const root=document.getElementById('memory-cloud'), q=s=>root.querySelector(s);
 const data=[{name:'PNB Edge',theme:'Office',topics:['MVP','Demo','Commercials','Open questions'],note:'Start with a managed service; consider a full build after validating demand.'},{name:'Home',theme:'Personal',topics:['Plans','Decisions','To-dos'],note:'A space for shared plans and everyday decisions.'},{name:'Conversation Memory',theme:'Side Projects',topics:['Experience','Memory engine','Release'],note:'Make recording effortless and memories easy to explore.'}];
 const demo={MVP:{fact:'Begin with a managed-service pilot before investing in a complete platform.',action:'Draft the phase-one scope.',question:'Which outcomes define a successful pilot?',quote:'Let’s start with a managed service and decide on a full build after the pilot.'},Demo:{fact:'The demo should explain the pilot workflow; the final review date is unconfirmed.',action:'Prepare a walkthrough of the proposed workflow.',question:'Who approves the demo narrative?',quote:'Please prepare the pilot walkthrough. We still need to confirm who will review it.'},Commercials:{fact:'The commercial assumptions need review before a proposal is shared.',action:'Validate the cost assumptions.',question:'What budget has been approved?',quote:'Let’s validate the costs before sharing a commercial proposal.'},'Open questions':{fact:'Pilot success criteria, demo approval and budget remain unresolved.',action:'Confirm owners for the open questions.',question:'Who will make each decision?',quote:'We still need owners for the pilot criteria, demo approval and budget.'}};
 let project=null,topic=null,view='map',tab='details',scope='All memories',answer='',query='';
 const escape=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const positions=[[50,43],[26,77],[74,77],[74,16]];
 const motionPreference=matchMedia('(prefers-reduced-motion: reduce)');
 const reduced=()=>motionPreference.matches;
 motionPreference.addEventListener('change',e=>{if(e.matches)root.getAnimations({subtree:true}).forEach(a=>a.cancel());});
 function transition(origin,back=false){const canvas=q('#mc-canvas');if(reduced()){root.getAnimations({subtree:true}).forEach(a=>a.cancel());return;}const box=canvas.getBoundingClientRect();const x=origin?origin.left+origin.width/2-box.left:box.width/2,y=origin?origin.top+origin.height/2-box.top:box.height/2;canvas.style.transformOrigin=`${x}px ${y}px`;canvas.animate([{transform:`scale(${back?1.14:.72})`,opacity:.35},{transform:'scale(1)',opacity:1}],{duration:420,easing:'cubic-bezier(.2,.75,.25,1)'});}
 function navigate(p,t=null,origin=null){project=p;topic=t;query='';q('#mc-search').value='';render();transition(origin);if(t)openRail('details');else q('#mc-canvas button')?.focus({preventScroll:true});}
 function render(){
  q('.mc-crumb').innerHTML=`<button class="mc-link" data-home>All memories</button>${project?`<span class="mc-muted">/</span><button class="mc-link" data-project>${escape(project.name)}</button>`:''}${topic?`<span class="mc-muted">/ ${escape(topic)}</span>`:''}`;
  q('[data-home]').onclick=()=>{project=null;topic=null;query='';q('#mc-search').value='';render();transition(null,true);};
  if(project)q('[data-project]').onclick=()=>{topic=null;render();};
  q('.mc-title').textContent=project?project.name:'A place for everything you know.';
  q('#mc-subtitle').textContent=project?`${project.theme} · Select a topic to see what you know.`:'Explore a project. Follow a thought.';
  q('#mc-theme').hidden=Boolean(project);q('#mc-search').placeholder=project?'Find a topic…':'Find a project…';
  let items=project?project.topics.map(name=>({name,sub:'Topic in '+project.name})):data.filter(p=>q('#mc-theme').value==='All themes'||p.theme===q('#mc-theme').value).map(p=>({name:p.name,sub:p.theme,p}));
  items=items.filter(i=>i.name.toLowerCase().includes(query.toLowerCase()));
  const canvas=q('#mc-canvas');canvas.className=view==='map'?'mc-map':'mc-list';canvas.setAttribute('aria-label',project?'Project topics':'Projects');
  canvas.innerHTML=items.length?items.map((item,i)=>{const pos=positions[i];return `<button class="mc-cloud" data-node="${escape(item.name)}" aria-pressed="${topic===item.name}" style="--x:${pos[0]}%;--y:${pos[1]}%;--fill:var(${i===1?'--mc-mint':i===2?'--mc-lilac':'--mc-blue'})"><strong>${escape(item.name)}</strong><small>${escape(item.sub)}</small>${project&&item.name==='Open questions'?'<small>Needs clarity</small>':''}</button>`;}).join(''):'<p class="mc-empty">No matching memories. Try another search or theme.</p>';
  canvas.querySelectorAll('[data-node]').forEach(button=>button.onclick=()=>{const item=items.find(i=>i.name===button.dataset.node);if(project){topic=item.name;render();openRail('details');}else navigate(item.p,null,button.getBoundingClientRect());});
  q('#mc-caption').textContent=project?'Topics share this project context. Open any topic to inspect its evidence.':'Select a cloud to explore its topics.';
  q('#mc-level').textContent=project?'Project → topics':'Projects';renderRail();
 }
 function source(){return '<button class="mc-source" id="mc-source">View sample source ↗</button><div id="mc-evidence" hidden></div>';}
 function bindAnswerSource(){
  const button=q('#mc-answer-source');if(!button)return;
  button.onclick=()=>{const el=q('#mc-answer-evidence');el.hidden=!el.hidden;const detail=demo[scope.split(' / ')[1]];el.textContent=detail?.quote||'Start with a managed service; confirm pilot criteria, demo approval and budget. — Fictional sample meeting';};
 }
 function renderRail(){
  q('#mc-details-tab').setAttribute('aria-selected',tab==='details');q('#mc-ask-tab').setAttribute('aria-selected',tab==='ask');
  const content=q('#mc-rail-content');
  if(tab==='details'){
   const detail=project?.name==='PNB Edge'&&topic?demo[topic]:null;
   content.innerHTML=`<div class="mc-eyebrow">${topic?'Topic overview':project?'Project overview':'Your memory space'}</div><h3>${escape(topic||project?.name||'Find the thread.')}</h3>${detail?`<div class="mc-block"><span class="mc-eyebrow">Current position</span><p>${escape(detail.fact)}</p>${source()}</div><div class="mc-block"><span class="mc-eyebrow">Open action</span><p>○ ${escape(detail.action)}</p></div><div class="mc-block"><span class="mc-eyebrow">Still unresolved</span><p>${escape(detail.question)}</p></div>`:`<p>${escape(project?.note||'Your conversations become connected context. Start with PNB Edge to explore the sample meeting knowledge.')}</p><div class="mc-block"><span class="mc-eyebrow">${project?'Explore':'Start here'}</span><p>${project?'Select a topic cloud. PNB Edge includes sample facts, actions and evidence.':'PNB Edge → Demo → current position, open action and evidence.'}</p></div>`}<button class="mc-control mc-question" id="mc-context-ask">Ask about ${escape(topic||project?.name||'your memories')} →</button>`;
   q('#mc-context-ask').onclick=()=>{scope=topic?project.name+' / '+topic:project?.name||'All memories';answer='';openRail('ask');};
   if(detail)q('#mc-source').onclick=()=>{const evidence=q('#mc-evidence');evidence.hidden=!evidence.hidden;evidence.innerHTML=`<blockquote>${escape(detail.quote)}</blockquote><span class="mc-muted">Illustrative meeting · 5 October · Fictional evidence</span>`;};
  }else{
   const scopes=['All memories',...data.map(p=>p.name),...(project?project.topics.map(t=>project.name+' / '+t):[])];if(!scopes.includes(scope))scopes.push(scope);
   content.innerHTML=`<div class="mc-eyebrow">Ask memories</div><h3>Keep the context.</h3><label class="mc-muted" for="mc-scope">Answer scope</label><select id="mc-scope" class="mc-control" style="width:100%;margin:8px 0 14px">${scopes.map(s=>`<option ${s===scope?'selected':''}>${escape(s)}</option>`).join('')}</select><p class="mc-muted">Sample responses only · No AI request is made.</p><button class="mc-control mc-question" data-question="status">Where do we stand?</button><button class="mc-control mc-question" data-question="open">What is still open?</button><div id="mc-answer" aria-live="polite">${answer}</div>`;
   bindAnswerSource();
   q('#mc-scope').onchange=e=>{scope=e.target.value;answer='';renderRail();};
   content.querySelectorAll('[data-question]').forEach(button=>button.onclick=()=>{const pn=scope.startsWith('PNB Edge');const t=scope.split(' / ')[1],d=demo[t];const text=pn?(button.dataset.question==='open'?(d?.question||'Confirm pilot success criteria, demo approval and the budget.'):(d?.fact||data[0].note)):'This preview has detailed evidence only for PNB Edge. Select PNB Edge to try a sample answer.';answer=`<div class="mc-answer"><span class="mc-eyebrow">${escape(scope)}</span><p>${escape(text)}</p>${pn?'<button class="mc-source" id="mc-answer-source">Sample meeting evidence</button><div id="mc-answer-evidence" hidden></div>':''}</div>`;q('#mc-answer').innerHTML=answer;if(pn)q('#mc-answer-source').onclick=()=>{const el=q('#mc-answer-evidence');el.hidden=!el.hidden;el.textContent=d?.quote||'“Start with a managed service. We still need pilot criteria, demo approval and budget.” — Fictional meeting, 5 October';};});
  }
 }
 function openRail(next){tab=next;renderRail();q('.mc-shell').classList.add('mobile-detail');(next==='ask'?q('#mc-scope'):q('#mc-details-tab'))?.focus({preventScroll:true});}
 q('#mc-close').onclick=()=>{q('.mc-shell').classList.remove('mobile-detail');q('#mc-canvas button')?.focus({preventScroll:true});};
 q('#mc-details-tab').onclick=()=>openRail('details');q('#mc-ask-tab').onclick=()=>openRail('ask');
 q('#mc-ask').onclick=()=>{scope=topic?project.name+' / '+topic:project?.name||'All memories';answer='';openRail('ask');};
 q('#mc-search').oninput=e=>{query=e.target.value;render();};q('#mc-theme').onchange=()=>render();
 q('#mc-view').onclick=()=>{view=view==='map'?'list':'map';q('#mc-view').textContent=view==='map'?'List view':'Map view';render();};
 render();
})();
</script>

</body></html>
